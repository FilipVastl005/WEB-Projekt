<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 550" width="100%" height="100%">
  <!-- Solid Clean Background (No Grid Lines) -->
  <rect width="500" height="550" fill="#E4ECF2" />

  <g transform="translate(0, 30)">
    <!-- Icon Mark -->
    <g transform="translate(100, 30)">
      <mask id="cutout-mask">
        <!-- Base Squircle -->
        <rect x="0" y="0" width="300" height="300" rx="64" fill="#FFFFFF" />
        
        <!-- Diagonal Cutout Slashes -->
        <polygon points="-20,95 205,-130 245,-90 20,135" fill="#000000" />
        <polygon points="55,245 280,20 320,60 95,285" fill="#000000" />
      </mask>

      <rect x="0" y="0" width="300" height="300" rx="64" fill="#004B80" mask="url(#cutout-mask)" />
    </g>

    <!-- Wordmark: MATEO -->
    <text x="250" y="410" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="62" 
          font-weight="900" 
          letter-spacing="4" 
          text-anchor="middle" 
          fill="#004B80">MATEO</text>

    <!-- Subtitle: SINCE 2026 -->
    <text x="250" y="460" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="28" 
          font-weight="600" 
          letter-spacing="14" 
          text-anchor="middle" 
          fill="#004B80">SINCE 2026</text>
  </g>
</svg>
